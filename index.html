<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto ke Elemen XML</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Foto ke Elemen</h1>
    <p class="sub">Auto trace: masukkan satu foto, semua objeknya ditelusuri jadi shape vektor terpisah di file XML untuk Alight Motion.</p>
  </header>

  <label class="pn" id="drop" for="file" tabindex="0">
    <i id="scan"></i>
    <div class="ico">⬆</div>
    <div id="dt">Pilih atau seret foto ke sini</div>
    <div id="ds">Diproses di perangkatmu, foto tidak diunggah</div>
    <input id="file" type="file" accept="image/*" class="hide">
  </label>

  <div id="res" class="hide" style="display:grid;gap:18px">
    <section class="pv">
      <div class="pn"><h3>Foto asli</h3><div class="fr"><img id="orig" alt="Foto asli"></div></div>
      <div class="pn"><h3>Hasil (seperti di Alight Motion)</h3><div class="fr"><div id="pv" class="stk"></div></div></div>
    </section>
    <section class="pn">
      <div class="st" id="st"></div>
      <div class="acts">
        <button class="bt" id="bx">Unduh XML Alight Motion</button>
        <button class="bt" id="bz">Unduh ZIP (XML per elemen)</button>
      </div>
    </section>
    <section class="pn">
      <h3>Daftar elemen <span class="hint">· arahkan untuk menyorot, ketuk untuk unduh XML-nya</span></h3>
      <div id="grid"></div>
    </section>
  </div>
</main>

<script src="vendor_imagetracer.js"></script>
<script src="script.js" defer></script>
</body>
</html>
